name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ENABLE_TEST_PAYMENTS: "false"
      ENABLE_TOYYIBPAY_SANDBOX: "false"
      ENABLE_DEV_SUBSCRIPTIONS: "false"
      ENABLE_SCHEDULED_JOBS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -- --webpack
      # This workflow intentionally has no database or provider secrets,
      # deployment step, migrations, seed, or write-capable smoke test.
